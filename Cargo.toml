[package]
name = "sitemaps"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Configurable sitemap crawling for Austrian news sites that yields article URLs only"

[dependencies]
chrono = "0.4"
futures = "0.3"
log = "0.4"
quick-xml = "0.41"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["time"] }
somes-scraper = { path = "../scraper" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
